# .github/workflows/keep-supabase-awake.yml

name: Keep Supabase Alive

on:
  schedule:
    # Every Sunday at 00:17 UTC
    - cron: "17 0 * * 0"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase Database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ROLE: ${{ secrets.SUPABASE_ROLE }}

        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::SUPABASE_URL secret is not set."
            exit 1
          fi

          if [ -z "$SUPABASE_ROLE" ]; then
            echo "::error::SUPABASE_ROLE secret is not set."
            exit 1
          fi

          curl -fsS -X GET \
            "$SUPABASE_URL/rest/v1/orders?select=id&limit=1" \
            -H "apikey: $SUPABASE_ROLE" \
            -H "Authorization: Bearer $SUPABASE_ROLE"

          echo "Supabase database ping successful."
